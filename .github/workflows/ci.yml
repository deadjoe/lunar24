#
# Cross-platform build + gate CI. One matrix job per OS; each configures, builds,
# and runs every CTest gate (regeneration zero-diff, header/license gate, negative
# fixture gate, id-stability regression, core contract tests, registry tests).

name: ci

on:
  push:
    branches: [main, feat/**, refocus/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.cxx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            cxx: g++
          - os: macos-latest
            cxx: clang++
          - os: windows-latest
            cxx: cl
    runs-on: ${{ matrix.os }}
    env:
      # The commit shown in About Lunar 24 (host/build_info.cmake): a pull request's own head
      # commit, not the merge commit the run checks out.
      LUNAR24_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # iPlug2 is a pinned submodule; the mac/win host build needs it.
          submodules: recursive

      - name: Install build tools (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3

      # The VST3 SDK (MIT licensed since 3.8) is not in the repo: fetch a pinned tag into the
      # iPlug2 submodule, where iPlug2's VST3 build looks for it.
      - name: Fetch VST3 SDK (mac/win)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd third_party/iPlug2/Dependencies/IPlug
          rm -rf VST3_SDK
          git clone --quiet --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git VST3_SDK
          git -C VST3_SDK submodule update --quiet --init --depth 1 base pluginterfaces public.sdk cmake

      - name: Configure project
        run: |
          python3 --version || python --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # GH#10: explicit ACTUAL-TARGET build of the standalone host, so a silent skip is
      # impossible. Linux never adds the host target (root CMakeLists gates to APPLE OR
      # WIN32), so this is mac/win only.
      - name: Build Lunar24 (actual target, mac/win)
        if: runner.os != 'Linux'
        run: cmake --build build --config Release --target Lunar24 --parallel

      # Assert the real artifact landed (a bundle executable vs a console .exe). The
      # .app path is produced by the mac bundle props; the .exe path by iplug_configure_app.
      - name: Assert Lunar24 artifact (mac/win)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -x build/out/Lunar24.app/Contents/MacOS/Lunar24 \
              || { echo "FAIL: mac bundle executable missing"; exit 1; }
          else
            test -f build/out/Lunar24.exe \
              || { echo "FAIL: Windows executable missing"; exit 1; }
          fi

      # Downloadable app for listening (Actions run page -> Artifacts).
      # Apple Silicon refuses to run a bundle whose signature was broken by the post-link
      # bundle steps ("is damaged"). Re-sign ad hoc (no developer identity) and check it.
      - name: Package app (mac)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build/out/Lunar24.app
          codesign --verify --deep --strict --verbose=2 build/out/Lunar24.app
          cd build/out && ditto -c -k --keepParent Lunar24.app Lunar24-macOS.zip
      - name: Upload app (mac)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: Lunar24-macOS
          path: build/out/Lunar24-macOS.zip
      - name: Upload app (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: Lunar24-Windows
          path: build/out/Lunar24.exe

      # The plugins (built by the Build step above): VST3 on mac and Windows, AU on mac.
      - name: Assert plugin bundles (mac/win)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -f build/out/Lunar24.vst3/Contents/MacOS/Lunar24 \
              || { echo "FAIL: VST3 bundle missing"; exit 1; }
            test -f build/out/Lunar24.component/Contents/MacOS/Lunar24 \
              || { echo "FAIL: AU bundle missing"; exit 1; }
          else
            test -f build/out/Lunar24.vst3/Contents/x86_64-win/Lunar24.vst3 \
              || { echo "FAIL: VST3 bundle missing"; exit 1; }
          fi
      - name: Package plugins (mac)
        if: runner.os == 'macOS'
        run: |
          for b in Lunar24.vst3 Lunar24.component; do
            codesign --force --deep --sign - "build/out/$b"
            codesign --verify --deep --strict --verbose=2 "build/out/$b"
          done
          mkdir -p build/out/Lunar24-Plugins
          cp -R build/out/Lunar24.vst3 build/out/Lunar24.component build/out/Lunar24-Plugins/
          cd build/out && ditto -c -k --keepParent Lunar24-Plugins Lunar24-Plugins-macOS.zip
      - name: Package plugins (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/out/Lunar24.vst3 -DestinationPath build/out/Lunar24-Plugins-Windows.zip
      # Steinberg's VST3 validator (built from the same SDK) and Apple's auval check the plugins
      # the way a DAW loads them: bus layout, state save / restore, processing at many block
      # sizes, and for the AU the Component Manager registration.
      - name: Validate VST3 (mac/win)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cmake -S third_party/iPlug2/Dependencies/IPlug/VST3_SDK -B build-vst3sdk \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF > /dev/null
          cmake --build build-vst3sdk --config Release --target validator --parallel > /dev/null
          validator=$(find build-vst3sdk/bin -name 'validator' -o -name 'validator.exe' | head -n 1)
          "$validator" build/out/Lunar24.vst3
      - name: Validate AU (mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/out/Lunar24.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -Eq "aumu +Lu24 +Lua2" || { auval -a | tail -n 20; echo "FAIL: AU not registered"; exit 1; }
          auval -strict -v aumu Lu24 Lua2

      - name: Upload plugins (mac)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: Lunar24-Plugins-macOS
          path: build/out/Lunar24-Plugins-macOS.zip
      - name: Upload plugins (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: Lunar24-Plugins-Windows
          path: build/out/Lunar24-Plugins-Windows.zip

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --build-config Release

  # AddressSanitizer + UndefinedBehaviorSanitizer over every test: catches out-of-bounds
  # access, use-after-free, leaks and undefined behaviour the plain builds let pass.
  sanitizers:
    name: ubuntu-26.04 (ASan + UBSan)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3

      - name: Configure (sanitizers)
        run: >
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san --parallel

      # ASan keeps every scope's locals apart, so test_machine_runtime (many ~190 KB runtimes
      # on main's stack) needs more than the default 8 MB stack.
      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ulimit -s 65536
          ctest --test-dir build-san --output-on-failure --parallel 4

  # ThreadSanitizer over the tests where the UI and audio threads really run at once.
  thread-sanitizer:
    name: ubuntu-26.04 (TSan)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3

      - name: Configure (TSan)
        run: >
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread"

      - name: Build
        run: >
          cmake --build build-tsan --parallel --target
          test_state_swap test_midi_map_apply test_midi_input_queue test_wav_recorder test_live_edits

      - name: Run tests
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: >
          ctest --test-dir build-tsan --output-on-failure
          -R "^(test_state_swap|test_midi_map_apply|test_midi_input_queue|test_wav_recorder|test_live_edits)$"

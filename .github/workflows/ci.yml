#
# Cross-platform build + gate CI. One matrix job per OS; each configures, builds,
# and runs every CTest gate (regeneration zero-diff, header/license gate, negative
# fixture gate, id-stability regression, core contract tests, registry tests).

name: ci

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.cxx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
          - os: macos-latest
            cxx: clang++
          - os: windows-latest
            cxx: cl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # GH#10: iPlug2 is a REAL pinned git submodule (third_party/iPlug2) that must be
          # present on every matrix platform — the iplug_pin_clean_gate CTest is registered
          # unconditionally and is FAIL-LOUD (no skip-if-absent). Without a recursive
          # checkout the gitlink is empty and the gate goes RED.
          submodules: recursive

      - name: Install build tools (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3

      - name: Configure project
        run: |
          python3 --version || python --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # GH#10: explicit ACTUAL-TARGET build of the standalone host, so a silent skip is
      # impossible. Linux never adds the host target (root CMakeLists gates to APPLE OR
      # WIN32), so this is mac/win only.
      - name: Build Lunar24Host (actual target, mac/win)
        if: runner.os != 'Linux'
        run: cmake --build build --config Release --target Lunar24Host --parallel

      # Assert the real artifact landed (a bundle executable vs a console .exe). The
      # .app path is produced by the mac bundle props; the .exe path by iplug_configure_app.
      - name: Assert Lunar24Host artifact (mac/win)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -x build/out/Lunar24Host.app/Contents/MacOS/Lunar24Host \
              || { echo "FAIL: mac bundle executable missing"; exit 1; }
          else
            test -f build/out/Lunar24Host.exe \
              || { echo "FAIL: Windows executable missing"; exit 1; }
          fi

      - name: Run gate suite (CTest)
        run: ctest --test-dir build --output-on-failure --build-config Release

  # Full-machine coverage gate, invoked with --require-full for REAL (not an
  # unused option). Independence is guaranteed by the manifest being transcribed
  # from the panel/manual (not generated from the registry) and by a separate
  # negative test proving the gate rejects 重件/no-evidence/NON-REGRESSION for the
  # intended reason. Intermediate commits may be <100% (this job is then RED, by
  # design) but must never regress the mustComplete baseline; this job turns green
  # exactly when every target module / program identity / route is present — the
  # signal that gates opening/merging PR #2.
  full-coverage:
    name: full coverage (--require-full)
    # This is a PR-merge gate (target main), NOT a feature-branch regression
    # alarm: it is necessarily RED until the whole panel is transcribed (P5 未铺完
    # => 尚未 100%). Running it on every push to feat/** would email a bogus
    # failure on every commit and train everyone to ignore CI exactly when a real
    # break lands. Gate it to pull_request so feature CI is green = true signal,
    # while the merge gate still blocks at PR time.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run registry completeness gate with --require-full
        run: |
          python3 --version || python --version
          python3 tools/check_registry_complete.py --require-full
